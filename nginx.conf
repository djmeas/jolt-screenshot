server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Baseline security headers (defense-in-depth). The app is fully
    # self-hosted: no third-party fonts, no analytics, no remote scripts.
    # Future contributors who add an external script MUST update the CSP
    # here to allow it.
    #
    # `script-src` carries `'unsafe-inline'` because `nuxt generate` emits
    # a small inline `<script>window.__NUXT__={...}</script>` for SSR
    # hydration. Static pre-rendering has no per-request nonce mechanism,
    # so a hash- or nonce-based policy is not feasible without moving to
    # an SSR server. The rest of the CSP is intentionally tight:
    # `default-src 'self'` blocks remote fetches, `object-src 'none'`
    # blocks plugins, `frame-ancestors 'none'` blocks clickjacking
    # embedding, `base-uri 'self'` blocks `<base>` hijacks. The importmap
    # inline script is also disabled via `experimental.entryImportMap: false`
    # in `nuxt.config.ts`, so `'unsafe-inline'` only needs to cover the one
    # `__NUXT__` hydration script.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Permissions-Policy: explicitly disable the high-value features we don't use.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # SPA fallback: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
